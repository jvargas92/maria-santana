$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Carousel
description: 'A horizontal track of slides that visitors swipe, scroll or step through with arrows. Drop any components into it, or use "Carousel slide" when one slide needs to hold several components.'
group: Layout
status: stable
props:
  type: object
  required:
    - label
  properties:
    label:
      type: string
      title: Accessible label
      description: Names the carousel for screen readers and assistive technology, which announce it before its contents. Describe what is in it, not that it is a carousel.
      # Required, so Canvas takes the field default from the first example here;
      # a `default` key alongside it would never be read.
      examples:
        - Featured work
    slides_per_view:
      type: string
      title: Slides shown at once
      description: Applies on tablet and desktop. One slide at a time on mobile, whichever is chosen.
      enum:
        - "1"
        - "2"
        - "3"
      meta:enum:
        "1": 1 slide
        "2": 2 slides
        "3": 3 slides
      default: "1"
      examples:
        - "1"
    aspect_ratio:
      type: string
      title: Slide shape
      description: 'Crops every slide to the same shape, so images of different sizes line up. "Natural" lets each slide size itself, which can make the carousel jump as it moves.'
      enum:
        - natural
        - "16:9"
        - "4:3"
        - "1:1"
        - "3:4"
      meta:enum:
        natural: Natural (no crop)
        "16:9": Widescreen 16:9
        "4:3": Landscape 4:3
        "1:1": Square
        "3:4": Portrait 3:4
      default: "16:9"
      examples:
        - "16:9"
    show_arrows:
      type: boolean
      title: Show previous and next arrows
      default: true
      examples:
        - true
    show_dots:
      type: boolean
      title: Show slide dots
      description: One dot per slide, which also jumps to it.
      default: true
      examples:
        - true
    autoplay:
      type: boolean
      title: Advance slides automatically
      description: 'Off is the safer choice: movement that starts on its own is hard to read and hard to use. When on, the carousel gets a pause button, stops while a visitor hovers or tabs into it, and never moves for visitors who have asked their device to reduce motion.'
      default: false
      examples:
        - false
    interval:
      type: string
      title: Seconds between slides
      description: Only used when slides advance automatically.
      enum:
        - "4"
        - "6"
        - "8"
        - "10"
        - "15"
      default: "6"
      examples:
        - "6"
slots:
  slides:
    title: Slides
    description: 'One slide per component placed here. A "Carousel slide" groups several components into a single slide.'

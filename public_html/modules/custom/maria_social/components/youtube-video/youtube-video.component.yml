$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: YouTube video
description: Embeds one YouTube video as a real player. A Shorts link is shown full height at 9:16, which is what a vertical reel needs and what an Instagram embed cannot do. Loads from YouTube only after the visitor consents.
group: Social
status: stable
props:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      format: uri
      title: Video link
      description: 'Any YouTube address: a watch link, a youtu.be link, or a Shorts link.'
      examples:
        - https://www.youtube.com/shorts/dQw4w9WgXcQ
        - https://www.youtube.com/watch?v=dQw4w9WgXcQ
        - https://youtu.be/dQw4w9WgXcQ
    shape:
      type: string
      title: Shape
      description: Shorts links are shown vertical automatically. Set it by hand for a vertical video that was uploaded as a normal video.
      enum:
        - auto
        - vertical
        - wide
      default: auto
      examples:
        - auto
        - vertical
    title:
      type: string
      title: Accessible title
      description: Describes the player for screen readers. Name the video.
      examples:
        - 'Reporting from Delaney Hall'

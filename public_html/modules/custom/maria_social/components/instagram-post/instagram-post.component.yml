$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Instagram post
description: Embeds one public Instagram post, reel or video. Loads from Instagram only after the visitor consents.
group: Social
status: stable
props:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      format: uri
      title: Post link
      description: The post's address, e.g. https://www.instagram.com/p/AbC123xyz/ (also works for /reel/).
      examples:
        - https://www.instagram.com/p/AbC123xyz/
    orientation:
      type: string
      title: Shape
      description: 'How wide the card sits. Instagram crops the media to 4:5 inside its own iframe whatever we do, so a 9:16 reel cannot be shown full height here; Tall just narrows the column so the 4:5 crop reads as portrait rather than wide. Reel and video links pick Tall automatically.'
      enum:
        - auto
        - tall
        - wide
      default: auto
      examples:
        - auto
        - tall
